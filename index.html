<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumon ERP Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFFFFF;
            color: #61CDFF;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.4);
        }
        
        header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Login Screen */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 22, 40, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .login-box {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-box h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .login-box p {
            color: #93c5fd;
            margin-bottom: 2rem;
        }
        
        .login-box input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .login-box input::placeholder {
            color: #93c5fd;
        }
        
        .login-box input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255,255,255,0.15);
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #3b82f6;
        }
        
        .stat-card h3 {
            font-size: 0.9rem;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
        }
        
        /* Controls */
        .controls {
            background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid #3b82f6;
        }
        
        .controls input, .controls select {
            padding: 0.75rem 1rem;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(30, 58, 138, 0.5);
            color: white;
            transition: all 0.2s;
        }
        
        .controls input:focus, .controls select:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(30, 58, 138, 0.7);
        }
        
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        
        /* Admin Panel */
        .admin-panel {
            background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #3b82f6;
        }
        
        .admin-panel h3 {
            color: #60a5fa;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        
        .admin-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .admin-form input {
            padding: 0.75rem 1rem;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(30, 58, 138, 0.5);
            color: white;
        }
        
        .admin-form input::placeholder {
            color: #93c5fd;
        }
        
        .admin-form input:focus {
            outline: none;
            border-color: #60a5fa;
        }
        
        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        
        .book-card {
            background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #3b82f6;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        
        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.3);
        }
        
        .book-card.available {
            border-left: 4px solid #22c55e;
        }
        
        .book-card.borrowed {
            border-left: 4px solid #f59e0b;
        }
        
        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: white;
        }
        
        .book-author {
            color: #93c5fd;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }
        
        .book-location {
            display: inline-block;
            background: rgba(59, 130, 246, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #bfdbfe;
            margin-bottom: 0.5rem;
        }
        
        .book-location::before {
            content: "📍 ";
        }
        
        .book-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #60a5fa;
            margin-bottom: 1rem;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-badge.available {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid #22c55e;
        }
        
        .status-badge.borrowed {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid #f59e0b;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        }
        
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .book-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .book-actions .btn {
            flex: 1;
            margin-top: 0;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #93c5fd;
        }
        
        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: white;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .toast.success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }
        
        .toast.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .toast.info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .controls input, .controls select {
                width: 100%;
            }
            
            .admin-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔐 Kumon ERP Library</h2>
            <p>Enter password to access</p>
            <input type="password" id="passwordInput" placeholder="Enter password (1111)" maxlength="10">
            <button class="btn btn-primary" onclick="login()" style="width: 100%;">Login</button>
            <p id="loginError" style="color: #fca5a5; margin-top: 1rem; display: none;">Invalid password</p>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <header>
            <div class="container" style="padding: 0;">
                <h1>📚 Kumon ERP Library</h1>
            </div>
        </header>
        
        <div class="container">
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Books</h3>
                    <div class="number" id="totalBooks">0</div>
                </div>
                <div class="stat-card">
                    <h3>Available</h3>
                    <div class="number" id="availableBooks">0</div>
                </div>
                <div class="stat-card">
                    <h3>Borrowed</h3>
                    <div class="number" id="borrowedBooks">0</div>
                </div>
            </div>
            
            <!-- Admin Panel -->
            <div class="admin-panel">
                <h3>⚡ Admin: Add New Book</h3>
                <div class="admin-form">
                    <input type="text" id="newBookTitle" placeholder="Book Title">
                    <input type="text" id="newBookAuthor" placeholder="Author">
                    <input type="text" id="newBookGenre" placeholder="Genre">
                    <input type="text" id="newBookLocation" placeholder="Location (e.g., Shelf A3)">
                </div>
                <button class="btn btn-primary" onclick="addBook()">Add Book</button>
            </div>
            
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search books by title or author...">
                <select id="filterStatus">
                    <option value="all">All Books</option>
                    <option value="available">Available Only</option>
                    <option value="borrowed">Borrowed Only</option>
                </select>
                <select id="sortBy">
                    <option value="title">Sort by Title</option>
                    <option value="author">Sort by Author</option>
                    <option value="status">Sort by Status</option>
                </select>
            </div>
            
            <div class="books-grid" id="booksGrid">
                <!-- Books will be rendered here -->
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <h2>No books found</h2>
                <p>Try adjusting your search or filter criteria</p>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script src="books-data.js"></script>
    <script>
        // Load books from Excel data or localStorage
        let books = JSON.parse(localStorage.getItem('kumonLibraryBooks')) || libraryBooks || [];
        
        let nextId = books.length > 0 ? Math.max(...books.map(b => b.id)) + 1 : 1;
        
        // Initialize if first time
        if (!localStorage.getItem('kumonLibraryBooks')) {
            saveBooks();
            showToast(`Loaded ${books.length} books from Kumon Library`, 'info');
        }
        
        function saveBooks() {
            localStorage.setItem('kumonLibraryBooks', JSON.stringify(books));
        }
        
        function login() {
            const password = document.getElementById('passwordInput').value;
            if (password === '1111') {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                showToast('Welcome to Kumon ERP Library!', 'success');
                updateStats();
                renderBooks();
            } else {
                document.getElementById('loginError').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('loginError').style.display = 'none';
                }, 2000);
            }
        }
        
        function updateStats() {
            const total = books.length;
            const available = books.filter(b => b.status === 'available').length;
            const borrowed = books.filter(b => b.status === 'borrowed').length;
            
            document.getElementById('totalBooks').textContent = total;
            document.getElementById('availableBooks').textContent = available;
            document.getElementById('borrowedBooks').textContent = borrowed;
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function addBook() {
            const title = document.getElementById('newBookTitle').value.trim();
            const author = document.getElementById('newBookAuthor').value.trim();
            const genre = document.getElementById('newBookGenre').value.trim();
            const location = document.getElementById('newBookLocation').value.trim();
            
            if (!title || !author || !location) {
                showToast('Please fill in title, author, and location', 'error');
                return;
            }
            
            const newBook = {
                id: nextId++,
                title: title,
                author: author,
                genre: genre || 'Uncategorized',
                location: location,
                status: 'available',
                borrower: null,
                borrowDate: null
            };
            
            books.push(newBook);
            saveBooks();
            updateStats();
            renderBooks();
            
            // Clear inputs
            document.getElementById('newBookTitle').value = '';
            document.getElementById('newBookAuthor').value = '';
            document.getElementById('newBookGenre').value = '';
            document.getElementById('newBookLocation').value = '';
            
            showToast(`"${title}" added successfully`);
        }
        
        function removeBook(id) {
            const book = books.find(b => b.id === id);
            if (book && confirm(`Are you sure you want to remove "${book.title}"?`)) {
                books = books.filter(b => b.id !== id);
                saveBooks();
                updateStats();
                renderBooks();
                showToast(`"${book.title}" removed`);
            }
        }
        
        function borrowBook(id) {
            const name = prompt("Enter borrower name:");
            if (!name || name.trim() === '') {
                showToast('Borrower name required', 'error');
                return;
            }
            
            const book = books.find(b => b.id === id);
            if (book) {
                book.status = 'borrowed';
                book.borrower = name.trim();
                book.borrowDate = new Date().toISOString().split('T')[0];
                saveBooks();
                renderBooks();
                updateStats();
                showToast(`"${book.title}" borrowed by ${name}`);
            }
        }
        
        function returnBook(id) {
            const book = books.find(b => b.id === id);
            if (book) {
                const previousBorrower = book.borrower;
                book.status = 'available';
                book.borrower = null;
                book.borrowDate = null;
                saveBooks();
                renderBooks();
                updateStats();
                showToast(`"${book.title}" returned by ${previousBorrower}`);
            }
        }
        
        function getFilteredAndSortedBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;
            const sortBy = document.getElementById('sortBy').value;
            
            let filtered = books.filter(book => {
                const matchesSearch = book.title.toLowerCase().includes(searchTerm) || 
                                     book.author.toLowerCase().includes(searchTerm) ||
                                     book.location.toLowerCase().includes(searchTerm);
                const matchesStatus = filterStatus === 'all' || book.status === filterStatus;
                return matchesSearch && matchesStatus;
            });
            
            filtered.sort((a, b) => {
                if (sortBy === 'title') return a.title.localeCompare(b.title);
                if (sortBy === 'author') return a.author.localeCompare(b.author);
                if (sortBy === 'status') return a.status.localeCompare(b.status);
                return 0;
            });
            
            return filtered;
        }
        
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const emptyState = document.getElementById('emptyState');
            const filteredBooks = getFilteredAndSortedBooks();
            
            if (filteredBooks.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            grid.innerHTML = filteredBooks.map(book => `
                <div class="book-card ${book.status}">
                    <div class="book-title">${escapeHtml(book.title)}</div>
                    <div class="book-author">by ${escapeHtml(book.author)}</div>
                    <div class="book-location">${escapeHtml(book.location)}</div>
                    <div class="book-meta">
                        <span>${escapeHtml(book.genre)}</span>
                        <span>•</span>
                        <span>ID: ${book.id}</span>
                    </div>
                    <span class="status-badge ${book.status}">
                        ${book.status === 'available' ? 'Available' : 'Borrowed'}
                    </span>
                    ${book.status === 'borrowed' ? `
                        <div style="margin-top: 0.5rem; font-size: 0.85rem; color: #93c5fd;">
                            Borrowed by: ${escapeHtml(book.borrower)}<br>
                            Date: ${book.borrowDate}
                        </div>
                        <div class="book-actions">
                            <button class="btn btn-success" onclick="returnBook(${book.id})">
                                Return Book
                            </button>
                            <button class="btn btn-danger btn-small" onclick="removeBook(${book.id})">
                                Remove
                            </button>
                        </div>
                    ` : `
                        <div class="book-actions">
                            <button class="btn btn-primary" onclick="borrowBook(${book.id})">
                                Borrow Book
                            </button>
                            <button class="btn btn-danger btn-small" onclick="removeBook(${book.id})">
                                Remove
                            </button>
                        </div>
                    `}
                </div>
            `).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Event listeners
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        
        document.getElementById('searchInput').addEventListener('input', renderBooks);
        document.getElementById('filterStatus').addEventListener('change', renderBooks);
        document.getElementById('sortBy').addEventListener('change', renderBooks);
        
        // Add book on Enter key
        ['newBookTitle', 'newBookAuthor', 'newBookGenre', 'newBookLocation'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addBook();
            });
        });
    </script>
</body>
</html>
