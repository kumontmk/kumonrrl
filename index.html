<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link to your external data file -->
    <script src="books-data.js"></script>
    <style>
        :root { --primary-color: #2c3e50; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: var(--primary-color) !important; }
        .book-card { transition: transform 0.2s; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .book-card:hover { transform: translateY(-5px); }
        .book-cover { height: 250px; object-fit: cover; border-radius: 4px 4px 0 0; background-color: #e9ecef; }
        .admin-only { display: none; }
        .level-badge { position: absolute; top: 10px; right: 10px; }
        #exportStatus { font-size: 0.85rem; color: #198754; display: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">ERP Reading Room</span>
        <div class="d-flex align-items-center">
            <button id="loginBtn" class="btn btn-outline-light btn-sm" onclick="toggleAdmin()">Staff Login</button>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm admin-only" onclick="toggleAdmin()">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Admin Controls -->
    <div id="adminPanel" class="admin-only card p-4 mb-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Management Console</h4>
            <div>
                <button class="btn btn-success me-2" onclick="exportData()">Export Updated Data</button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">Add New Book</button>
            </div>
        </div>
        <p id="exportStatus" class="mb-0 fw-bold">✓ Data copied to clipboard! Paste it into books-data.js</p>
    </div>

    <!-- Search & Filter -->
    <div class="row mb-4">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by title, author, or level..." onkeyup="filterBooks()">
        </div>
    </div>

    <!-- Stats Bar -->
    <div class="row mb-4 text-center" id="statsBar"></div>

    <!-- Book Grid -->
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="bookGrid">
        <!-- Books rendered here -->
    </div>
</div>

<!-- Add Book Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Register New Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="bookForm">
                    <div class="mb-3"><input type="text" id="title" class="form-control" placeholder="Book Title" required></div>
                    <div class="mb-3"><input type="text" id="author" class="form-control" placeholder="Author" required></div>
                    <div class="mb-3">
                        <select id="rrlLevel" class="form-select">
                            <option value="A">Level A</option>
                            <option value="B">Level B</option>
                            <option value="C">Level C</option>
                            <option value="D">Level D</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cover Image</label>
                        <input type="file" id="coverImage" class="form-control" accept="image/*">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="addNewBook()">Save to List</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // INITIALIZATION: Load from books-data.js (libraryBooks constant)
    let books = (typeof libraryBooks !== 'undefined') ? [...libraryBooks] : [];
    let isAdmin = false;

    // LOGIN LOGIC
    function toggleAdmin() {
        const password = isAdmin ? null : prompt("Enter Staff Password:");
        if (!isAdmin && password === "staff123") {
            isAdmin = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            document.getElementById('loginBtn').style.display = 'none';
        } else {
            isAdmin = false;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            document.getElementById('loginBtn').style.display = 'block';
        }
        renderBooks();
    }

    // RENDER FUNCTION
    function renderBooks(data = books) {
        const grid = document.getElementById('bookGrid');
        grid.innerHTML = data.map(book => `
            <div class="col">
                <div class="card h-100 book-card">
                    <span class="badge bg-info level-badge">Level ${book.rrlLevel}</span>
                    <img src="${book.coverImage || 'https://via.placeholder.com/250x350?text=No+Cover'}" class="card-img-top book-cover">
                    <div class="card-body">
                        <h6 class="card-title">${book.title}</h6>
                        <p class="card-text text-muted small">${book.author}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge ${book.status === 'available' ? 'bg-success' : 'bg-warning'}">${book.status}</span>
                            ${isAdmin ? `<button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">Remove</button>` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        updateStats();
    }

    // ADD BOOK
    function addNewBook() {
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;
        const level = document.getElementById('rrlLevel').value;
        const imageFile = document.getElementById('coverImage').files[0];

        if (!title || !author) return alert("Please fill in Title and Author.");

        const reader = new FileReader();
        reader.onload = function(e) {
            const newBook = {
                id: Date.now(),
                title,
                author,
                rrlLevel: level,
                coverImage: imageFile ? e.target.result : null,
                status: 'available'
            };
            books.push(newBook);
            bootstrap.Modal.getInstance(document.getElementById('addBookModal')).hide();
            document.getElementById('bookForm').reset();
            renderBooks();
        };

        if (imageFile) {
            reader.readAsDataURL(imageFile);
        } else {
            reader.onload({target: {result: null}});
        }
    }

    // DELETE BOOK
    function deleteBook(id) {
        if (confirm("Permanently remove this book?")) {
            books = books.filter(b => b.id !== id);
            renderBooks();
        }
    }

    // SEARCH
    function filterBooks() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = books.filter(b => 
            b.title.toLowerCase().includes(term) || 
            b.author.toLowerCase().includes(term) ||
            b.rrlLevel.toLowerCase().includes(term)
        );
        renderBooks(filtered);
    }

    // UPDATE STATS
    function updateStats() {
        const stats = document.getElementById('statsBar');
        const available = books.filter(b => b.status === 'available').length;
        stats.innerHTML = `
            <div class="col-4"><div class="p-2 bg-white rounded shadow-sm"><strong>${books.length}</strong><br>Total</div></div>
            <div class="col-4"><div class="p-2 bg-white rounded shadow-sm"><strong>${available}</strong><br>Available</div></div>
            <div class="col-4"><div class="p-2 bg-white rounded shadow-sm"><strong>${books.length - available}</strong><br>Borrowed</div></div>
        `;
    }

    // DATA EXPORT (THE KEY FEATURE)
    function exportData() {
        // Formats the data into the structure books-data.js expects
        const dataStr = "const libraryBooks = " + JSON.stringify(books, null, 4) + ";";
        
        // 1. Copy to clipboard
        const el = document.createElement('textarea');
        el.value = dataStr;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        // 2. Download the file
        const blob = new Blob([dataStr], {type: "text/javascript"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = "books-data.js";
        link.click();

        // 3. Show success message
        const status = document.getElementById('exportStatus');
        status.style.display = 'block';
        setTimeout(() => { status.style.display = 'none'; }, 5000);
    }

    // Initial load
    window.onload = () => renderBooks();
</script>

</body>
</html>
